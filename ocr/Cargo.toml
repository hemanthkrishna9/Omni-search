[package]
name = "digup-ocr"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reads the text in a picture with Windows' built-in OCR, for DigUp's image search."

# Built on its own, never as a member of a parent workspace.
[workspace]

[[bin]]
name = "digup-ocr"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
