# Builds the Windows on ARM64 installer (DigUp-*-setup.exe, NSIS, per-user, no admin prompt) on GitHub's windows-11-arm
# runner and keeps it as the run's artifact: windows.yml's job with ARM64 pieces (scripts choose by DIGUP_ARCH=arm64).
# Differences: MSYS2's CLANGARM64 builds ffmpeg, llama.cpp is built with clang and CPU only (no Vulkan SDK for ARM64 is
# installed), PDFium is its win-arm64 build. Runs on every push and by hand (Actions → Windows ARM64 → Run workflow).
# Download the installer from the run's "DigUp-windows-arm64" artifact.
name: Windows ARM64

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    runs-on: windows-11-arm
    env:
      DIGUP_ARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The small ffmpeg is built once per version of its build script (build-ffmpeg.sh does nothing when it's there).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-windows-arm64-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-meson mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-zlib
      - name: ffmpeg
        # The small LGPL ffmpeg the installer carries (as the Linux packages do): only what DigUp reads, so its licenses
        # are FFmpeg's, dav1d's and zlib's. Built with MSYS2's clang (CLANGARM64), before the MSVC environment.
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: arm64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Build
        shell: bash
        run: |
          # MSVC's tools before Git's: Git's /usr/bin/link (coreutils) would stand in for link.exe.
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
          scripts/package-windows.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DigUp-windows-arm64
          path: |
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/src-tauri/target/release/bundle/nsis/*.exe.sig
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: embeddinggemma-2-q8_0-bfcd298-windows
      - name: Russian as a second OCR language
        timeout-minutes: 10
        # The installer test reads English and Russian pictures: Russian OCR installed, and ru-RU after en-US in the
        # user's language list (digup-ocr reads with each of the person's languages).
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          # Russian comes from Windows Update, which can hang for a quarter of an hour on a runner: it gets six minutes,
          # and without it the test skips only the check that needs Cyrillic letters (OCR_RUSSIAN).
          $job = Start-Job { Add-WindowsCapability -Online -Name "Language.OCR~~~ru-RU~0.0.1.0" }
          if (Wait-Job $job -Timeout 360) { Receive-Job $job } else { "Russian OCR didn't install in time" }
          $state = (Get-WindowsCapability -Online -Name "Language.OCR~~~ru-RU~0.0.1.0").State
          "Russian OCR: $state"
          if ($state -eq "Installed") {
            $l = Get-WinUserLanguageList
            if (-not ($l | Where-Object LanguageTag -eq "ru-RU")) { $l.Add("ru-RU") }
            Set-WinUserLanguageList $l -Force
            "OCR_RUSSIAN=1" >> $env:GITHUB_ENV
          }
          (Get-WinUserLanguageList).LanguageTag
      - name: The installer
        shell: bash
        run: MODELS="$PWD/models" scripts/check-windows-package.sh shell/src-tauri/target/release/bundle/nsis/*-setup.exe
